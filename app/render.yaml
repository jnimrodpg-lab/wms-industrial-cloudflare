services:
  - type: web
    name: wms-industrial
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: DB_PATH
        value: /opt/render/project/src/data/wms.sqlite
    disk:
      name: wms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
